# Deployment sano: sirve de comparación ("2 de N pods con problemas").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab
  labels: {app: web, env: staging}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web, env: staging}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
