# App para practicar triage (diapositiva 08), paso 1: la versión v2.4.0 funciona.
# make lab-up la despliega, espera a que esté lista y después aplica
# incident/checkout-v2.4.1.yaml, que rompe la conexión a la base.
#
# La estrategia maxSurge=0 / maxUnavailable=2 hace que el rollout se trabe con
# 1 pod viejo sano y 2 pods nuevos en CrashLoopBackOff: "1 de 3 réplicas listas".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: lab
  labels: {app: checkout, env: staging}
  annotations:
    kubernetes.io/change-cause: "v2.4.0: versión estable"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 2}
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout, env: staging, app.kubernetes.io/version: v2.4.0}
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          env:
            - name: APP_VERSION
              value: v2.4.0
          command:
            - sh
            - -c
            - |
              echo "checkout ${APP_VERSION} starting"
              echo "using in-memory store, no database needed"
              exec sleep 360000
          resources:
            requests: {cpu: 10m, memory: 8Mi}
